name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "codeshot-web/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy web app to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: codeshot-web
          clean: false
          commit-message: "Deploy: ${{ github.event.head_commit.message }} (${{ github.sha }})"
